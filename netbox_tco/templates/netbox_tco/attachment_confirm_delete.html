{% extends 'generic/object.html' %}

{% block content %}
<div class="row">
  <div class="col col-md-6">
    <div class="card border-danger">
      <h5 class="card-header bg-danger text-white">Confirm Deletion</h5>
      <div class="card-body">
        <p>Are you sure you want to delete the attachment <strong>{{ object.name }}</strong>?
        The file will be permanently removed from storage.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Delete</button>
          <a href="{{ cancel_url }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
