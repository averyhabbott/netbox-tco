{% if lifecycle_record %}
<div class="card">
  <h5 class="card-header">
    EOS/EOL — <a href="{{ lifecycle_record.get_absolute_url }}">{{ lifecycle_record.name }}</a>
  </h5>
  <div class="card-body">
    <table class="table table-hover attr-table">
      <thead>
        <tr><th>Milestone</th><th>Date</th></tr>
      </thead>
      <tbody>
        {% for m in milestones %}
        <tr{% if m.date < today %} class="table-danger"{% endif %}>
          <td>{{ m.milestone_type }}</td>
          <td>{{ m.date }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="2" class="text-muted">No milestones defined.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endif %}
